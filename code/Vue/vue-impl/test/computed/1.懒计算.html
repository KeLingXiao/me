<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 懒计算</title>
<h1>computed - 懒计算</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    let calls = 0;
    const value = computed(() => ++calls);
    assert(calls === 0, "创建时不应执行 getter");
    assert(value.value === 1 && calls === 1, "首次读取应执行 getter");
    result.textContent = 'PASS：computed - 懒计算';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
