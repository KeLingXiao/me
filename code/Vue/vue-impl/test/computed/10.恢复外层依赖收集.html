<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 恢复外层依赖收集</title>
<h1>computed - 恢复外层依赖收集</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    const s = reactive({ n: 1, other: 2 });
    const value = computed(() => s.n * 2);
    let valueResult;
    effect(() => valueResult = value.value + s.other);
    s.other = 3;
    assert(valueResult === 5, "计算结束后应继续收集外层依赖");
    s.n = 2;
    assert(valueResult === 7, "计算属性依赖仍应触发更新");
    result.textContent = 'PASS：computed - 恢复外层依赖收集';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
