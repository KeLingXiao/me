<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 缓存计算结果</title>
<h1>computed - 缓存计算结果</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    const s = reactive({ n: 1 });
    let calls = 0;
    const value = computed(() => {
      calls++;
      return s.n * 2;
    });
    assert(value.value === 2 && value.value === 2, "重复读取应返回计算结果");
    assert(calls === 1, "依赖未变化时应使用缓存");
    result.textContent = 'PASS：computed - 缓存计算结果';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
