<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 只读计算属性</title>
<h1>computed - 只读计算属性</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    const s = reactive({ n: 1 });
    const originalWarn = console.warn;
    let warnings = 0;
    try {
      console.warn = () => warnings++;
      const value = computed(() => s.n);
      const optionsValue = computed({ get: () => s.n });
      value.value = 2;
      optionsValue.value = 3;
      assert(warnings === 2, "未提供 setter 时赋值应提示只读");
      assert(s.n === 1 && value.value === 1 && optionsValue.value === 1, "只读赋值不应改变状态");
    } finally {
      console.warn = originalWarn;
    }
    result.textContent = 'PASS：computed - 只读计算属性';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
