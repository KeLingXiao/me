<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 分支切换清理依赖</title>
<h1>computed - 分支切换清理依赖</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    const s = reactive({ flag: true, a: 1, b: 2 });
    const value = computed(() => s.flag ? s.a : s.b);
    let valueResult, calls = 0;
    effect(() => {
      calls++;
      valueResult = value.value;
    });
    s.flag = false;
    assert(valueResult === 2 && calls === 2, "切换分支应收集新依赖");
    s.a = 3;
    assert(valueResult === 2 && calls === 2, "旧分支依赖不应触发更新");
    s.b = 4;
    assert(valueResult === 4 && calls === 3, "新分支依赖应触发更新");
    result.textContent = 'PASS：computed - 分支切换清理依赖';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
