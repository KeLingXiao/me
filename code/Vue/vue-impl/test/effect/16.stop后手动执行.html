<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effect - stop后手动执行</title>
<h1>effect - stop后手动执行</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect } = Reactivity;
    const s = reactive({
      n: 1
    });
    let value, runs = 0;
    const runner = effect(() => {
      runs++;
      return value = s.n;
    });
    runner.effect.stop();
    s.n = 2;
    assert(runner() === 2 && value === 2, "停止后仍可手动运行");
    s.n = 3;
    assert(runs === 2, "手动执行不应重新订阅");
    result.textContent = 'PASS：effect - stop后手动执行';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
