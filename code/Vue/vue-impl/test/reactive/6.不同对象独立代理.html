<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>reactive - 不同对象独立代理</title>
<h1>reactive - 不同对象独立代理</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition) {
    if (!condition) throw new Error('断言失败：reactive - 不同对象独立代理');
  }

  try {
    const { reactive, effect } = Reactivity;
    const a = reactive({
      n: 1
    }), b = reactive({
      n: 1
    });
    a.n = 2;
    assert(a !== b && b.n === 1);
    result.textContent = 'PASS：reactive - 不同对象独立代理';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
