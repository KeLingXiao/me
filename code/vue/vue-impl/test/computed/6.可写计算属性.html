<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 可写计算属性</title>
<h1>computed - 可写计算属性</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    const s = reactive({ n: 1 });
    const value = computed({
      get: () => s.n * 2,
      set: newValue => s.n = newValue / 2
    });
    let valueResult;
    effect(() => valueResult = value.value);
    value.value = 8;
    assert(s.n === 4, "赋值应调用 setter 更新原始状态");
    assert(value.value === 8 && valueResult === 8, "赋值后应更新计算结果及订阅者");
    result.textContent = 'PASS：computed - 可写计算属性';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
