<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>computed - 缓存读取收集依赖</title>
<h1>computed - 缓存读取收集依赖</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect, computed } = Reactivity;
    const s = reactive({ n: 1 });
    const value = computed(() => s.n * 2);
    assert(value.value === 2, "预先读取应建立缓存");
    let first, second;
    effect(() => first = value.value);
    effect(() => second = value.value);
    s.n = 2;
    assert(first === 4 && second === 4, "读取缓存的多个 effect 都应订阅更新");
    result.textContent = 'PASS：computed - 缓存读取收集依赖';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
