<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effect - scheduler配合runner执行</title>
<h1>effect - scheduler配合runner执行</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  try {
    const { reactive, effect } = Reactivity;
    const s = reactive({
      n: 1
    });
    let value, pending;
    const runner = effect(() => value = s.n, {
      scheduler() {
        pending = runner;
      }
    });
    s.n = 2;
    assert(value === 1 && pending === runner, "调度时应暂缓执行");
    pending();
    assert(value === 2, "runner 应读取最新值");
    result.textContent = 'PASS：effect - scheduler配合runner执行';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
