<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effect - 嵌套恢复外层依赖</title>
<h1>effect - 嵌套恢复外层依赖</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition) {
    if (!condition) throw new Error('断言失败：effect - 嵌套恢复外层依赖');
  }

  try {
    const { reactive, effect } = Reactivity;
    const s = reactive({
      a: 1, b: 1
    });
    let outer = 0, inner = 0;
    effect(() => {
      outer++;
      effect(() => {
        inner++;
        s.b;
      });
      s.a;
    });
    s.b++;
    assert(outer === 1 && inner === 2);
    s.a++;
    assert(outer === 2);
    result.textContent = 'PASS：effect - 嵌套恢复外层依赖';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
