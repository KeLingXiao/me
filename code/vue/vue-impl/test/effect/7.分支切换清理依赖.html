<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effect - 分支切换清理依赖</title>
<h1>effect - 分支切换清理依赖</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition) {
    if (!condition) throw new Error('断言失败：effect - 分支切换清理依赖');
  }

  try {
    const { reactive, effect } = Reactivity;
    const s = reactive({
      ok: true, a: 1, b: 2
    });
    let runs = 0, value;
    effect(() => {
      runs++;
      value = s.ok ? s.a : s.b;
    });
    s.ok = false;
    assert(value === 2 && runs === 2);
    s.a++;
    assert(runs === 2);
    s.b++;
    assert(value === 3 && runs === 3);
    result.textContent = 'PASS：effect - 分支切换清理依赖';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
