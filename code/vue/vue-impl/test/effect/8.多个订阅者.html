<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effect - 多个订阅者</title>
<h1>effect - 多个订阅者</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition) {
    if (!condition) throw new Error('断言失败：effect - 多个订阅者');
  }

  try {
    const { reactive, effect } = Reactivity;
    const s = reactive({
      n: 1
    });
    let a, b;
    effect(() => a = s.n);
    effect(() => b = s.n * 2);
    s.n = 3;
    assert(a === 3 && b === 6);
    result.textContent = 'PASS：effect - 多个订阅者';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
