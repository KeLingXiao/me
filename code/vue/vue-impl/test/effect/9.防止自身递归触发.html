<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effect - 防止自身递归触发</title>
<h1>effect - 防止自身递归触发</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition) {
    if (!condition) throw new Error('断言失败：effect - 防止自身递归触发');
  }

  try {
    const { reactive, effect } = Reactivity;
    const s = reactive({
      n: 0
    });
    let runs = 0;
    effect(() => {
      runs++;
      s.n++;
    });
    assert(runs === 1 && s.n === 1);
    result.textContent = 'PASS：effect - 防止自身递归触发';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
