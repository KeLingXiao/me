<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>effectScope - 嵌套与独立作用域</title>
<h1>effectScope - 嵌套与独立作用域</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById("result");
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  try {
    const { reactive, effect, computed, ref, toRef, toRefs, proxyRefs, watch, watchEffect, effectScope, getCurrentScope, onScopeDispose } = Reactivity;
    const n = ref(1);
    let childCalls = 0, detachedCalls = 0;
    const parent = effectScope();
    let detached;
    parent.run(() => {
      effectScope().run(() => effect(() => {
        n.value;
        childCalls++;
      }));
      detached = effectScope(true);
      detached.run(() => effect(() => {
        n.value;
        detachedCalls++;
      }));
    });
    parent.stop();
    n.value = 2;
    assert(childCalls === 1 && detachedCalls === 2, "\u72EC\u7ACB\u4F5C\u7528\u57DF\u4E0D\u968F\u7236\u7EA7\u505C\u6B62");
    detached.stop();
    result.textContent = "PASS\uFF1AeffectScope - \u5D4C\u5957\u4E0E\u72EC\u7ACB\u4F5C\u7528\u57DF";
    result.style.color = "green";
  } catch (error) {
    result.textContent = "FAIL\uFF1A" + error.message;
    result.style.color = "red";
    console.error(error);
  }
</script>
</html>
