<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>reactive - 读取属性</title>
<h1>reactive - 读取属性</h1>
<pre id="result">运行中…</pre>
<script src="../../packages/reactivity/dist/reactivity.global.js"></script>
<script>
  const result = document.getElementById('result');
  function assert(condition) {
    if (!condition) throw new Error('断言失败：reactive - 读取属性');
  }

  try {
    const { reactive, effect } = Reactivity;
    const raw = {
      n: 1
    };
    const p = reactive(raw);
    assert(p !== raw && p.n === 1);
    result.textContent = 'PASS：reactive - 读取属性';
    result.style.color = 'green';
  } catch (error) {
    result.textContent = 'FAIL：' + error.message;
    result.style.color = 'red';
    console.error(error);
  }
</script>
</html>
